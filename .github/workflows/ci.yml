name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every version in pyproject's classifiers is tested here. The oldest
        # and newest are the ones that break: 3.10 lacks syntax the code may
        # drift into, and 3.14 is where dependencies stop having wheels.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # Linux covers the version matrix; macOS and Windows are there for
          # path handling, so they only need the oldest and newest.
          - { os: macos-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.13" }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[watch,dev]"

      # No Ollama here on purpose. The suite uses a deterministic fake embedder
      # and stubs retrieval, so it tests sift's own logic rather than a model.
      - name: Test
        run: pytest -q

      - name: Smoke-test the CLI
        run: |
          sift --version
          sift --help
