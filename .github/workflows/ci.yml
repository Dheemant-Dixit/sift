name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this, so the matrix runs against the exact commit being
  # published. A tag can point anywhere — "it passed on main" is not the same
  # claim as "the artifact going to PyPI passed".
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every version in pyproject's classifiers is tested here. The oldest
        # and newest are the ones that break: 3.10 lacks syntax the code may
        # drift into, and 3.14 is where dependencies stop having wheels.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # Linux covers the version matrix; macOS and Windows are there for
          # path handling, so they only need the oldest and newest.
          - { os: macos-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.13" }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[watch,dev]"

      # No Ollama here on purpose. The suite uses a deterministic fake embedder
      # and stubs retrieval, so it tests sift's own logic rather than a model.
      - name: Test
        run: pytest -q

      - name: Smoke-test the CLI
        run: |
          sift --version
          sift --help

  # Coverage is gated on ONE job, not all nine. Per-OS coverage legitimately
  # differs — the ctypes probe in config.py only executes on Windows, and each
  # platform branch of open_file.py runs only where it applies — so a single
  # threshold across the matrix would either be too low to mean anything or
  # fail on the platforms it wasn't measured against.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[watch,dev]"

      # The floor sits a little under the current figure so ordinary churn
      # doesn't fail the build, while a module losing its tests still does.
      # Deliberate gaps (prompt_toolkit's event loop, the Windows-only ctypes
      # probe) are documented in tests/README.md.
      - name: Test with coverage
        run: pytest -q --cov=sift_downloads --cov-report=term-missing --cov-fail-under=92
