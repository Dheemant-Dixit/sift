[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sift-downloads"
version = "0.1.1"
description = "Ask your Downloads folder where a file is — and what it says. Runs entirely on your machine."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Dheemant Dixit", email = "dheemantdixit1107@gmail.com" }]
keywords = ["rag", "search", "downloads", "local-first", "ollama", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litellm>=1.60",
    "numpy>=1.24",
    "prompt_toolkit>=3.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
watch = ["watchdog>=4.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Dheemant-Dixit/sift"
Repository = "https://github.com/Dheemant-Dixit/sift"
Issues = "https://github.com/Dheemant-Dixit/sift/issues"

# The command stays `sift` — that's what users type, and it's independent of
# the distribution name, which had to change because `sift` is taken on PyPI.
[project.scripts]
sift = "sift_downloads.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sift_downloads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
