[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sift"
version = "0.1.0"
description = "Ask your Downloads folder where a file is — and what it says. Runs entirely on your machine."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["rag", "search", "downloads", "local-first", "ollama", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "litellm>=1.60",
    "numpy>=1.24",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
watch = ["watchdog>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
sift = "sift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
