[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sift-downloads"
# Read from src/sift_downloads/__init__.py — see [tool.hatch.version] below.
dynamic = ["version"]
description = "Ask your Downloads folder where a file is — and what it says. Runs entirely on your machine."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Dheemant Dixit", email = "dheemantdixit1107@gmail.com" }]
keywords = ["rag", "search", "downloads", "local-first", "ollama", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Capped on 3.10 ONLY. litellm 1.98.0 ships `from typing import NotRequired`,
    # which needs 3.11, while its own metadata still claims 3.10 support — so
    # `import litellm` raises ImportError there and sift cannot start at all.
    # A plain `!=1.98.0` would hold every other Python back too and would not
    # cover a 1.98.1 with the same line in it. Lift the cap once a fixed release
    # is out and 3.10 can install it.
    "litellm>=1.60; python_version >= '3.11'",
    "litellm>=1.60,<1.98; python_version < '3.11'",
    "numpy>=1.24",
    "prompt_toolkit>=3.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
watch = ["watchdog>=4.0"]
# pytest-randomly shuffles test order every run, which is what catches tests
# that only pass because an earlier one left state behind.
#
# ruff is pinned to a minor range on purpose: every minor release adds rules,
# and an unpinned linter turns "someone else published a version" into "your
# unrelated PR is red". Widen it deliberately, as its own change.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-randomly>=3.15", "ruff>=0.16,<0.17"]

[project.urls]
Homepage = "https://github.com/Dheemant-Dixit/sift"
Repository = "https://github.com/Dheemant-Dixit/sift"
Issues = "https://github.com/Dheemant-Dixit/sift/issues"

# The command stays `sift` — that's what users type, and it's independent of
# the distribution name, which had to change because `sift` is taken on PyPI.
[project.scripts]
sift = "sift_downloads.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sift_downloads"]

# One version, in one place. It used to be written twice — here and in
# __init__.py — and nothing checked that the two agreed. That matters more than
# tidiness now that a git tag triggers a PyPI upload: a release is a claim that
# tag == version, PyPI never lets a version number be reused, and a guard
# against a duplicate you can simply delete is the wrong shape of fix.
# hatchling greps the file for `__version__ = "..."`; it does not import it,
# so the litellm env-var side effect at the top of __init__.py never runs here.
[tool.hatch.version]
path = "src/sift_downloads/__init__.py"

# There was no linter here at all until now, which is how five unused imports,
# a dead local and a `# noqa` for a rule that no longer fires accumulated in a
# repo this small. The selection is deliberately narrow: rules that catch a
# mistake, not rules that impose a house style nobody agreed to.
[tool.ruff]
line-length = 100          # what the code already targets; 8 lines were over

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle — whitespace, line length
    "F",        # pyflakes — unused imports, undefined names, dead locals
    "I",        # isort — so no diff ever contains an incidental import reshuffle
    "UP",       # pyupgrade — syntax the >=3.10 floor already permits
    "B",        # bugbear — the one real defect this whole change found is B905
    "C4",       # comprehension and call forms
    "SIM",      # simplifiable constructs
    "RUF",      # ruff's own, including RUF100: a suppression that stopped applying
]
ignore = [
    # These two are not wrong in general. They are wrong here, and saying so in
    # one place beats scattering `# noqa` over the sites they misjudge.
    #
    # RUF022 wants __all__ alphabetised. It is grouped by module instead —
    # config, then find, then generate, then index/retrieve — mirroring the
    # pipeline in the README. Sorting it would split `answer` from `Answer`
    # and file both away from `find_files`, telling a reader strictly less.
    "RUF022",
    # SIM102 wants the nested `if`s in ingest.extract_pdf collapsed with `and`.
    # The comment between them explains the INNER condition — why the empty
    # password is tried first — and has nowhere to live in a collapsed form.
    # The nesting is carrying the explanation.
    "SIM102",
]

[tool.ruff.lint.isort]
# Keeps first-party imports in their own block BELOW third-party, which is what
# holds `import litellm` above the config import in index.py. That ordering is a
# hard constraint, not a preference — see the LITELLM_LOCAL_MODEL_COST_MAP note
# in __init__.py — so the import sorter has to be told about it explicitly
# rather than left to guess from the directory layout.
# `evalset` and `tests` are named here for the same reason: neither lives on
# sys.path the way an installed package does, so isort would file them as
# third-party and hoist `from evalset import CORPUS` above the sift imports in
# evals/conftest.py — sorting a local helper into the same block as pytest.
known-first-party = ["sift_downloads", "evalset", "tests"]

[tool.pytest.ini_options]
# testpaths deliberately excludes evals/: those need Ollama and a chat model,
# take a minute, and are not deterministic enough to gate a merge. Run them
# with `pytest evals/`. See evals/README.md.
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "eval: answer-quality check against a real model (needs Ollama; not run in CI)",
]

[tool.coverage.run]
source = ["src/sift_downloads"]

[tool.coverage.report]
# ui.py's prompt_toolkit key bindings and event loop, and the Windows-only
# ctypes probe in config.py, are the deliberate gaps — see tests/README.md.
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
